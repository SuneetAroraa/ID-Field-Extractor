<svg viewBox="0 0 800 930" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#333333"/>
    </marker>
  </defs>

  <rect width="800" height="930" fill="#ffffff"/>

  <!-- Input -->
  <rect x="280" y="20" width="240" height="55" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.5"/>
  <text x="400" y="53" text-anchor="middle" font-size="16" fill="#111111">Input Image</text>

  <line x1="400" y1="75" x2="400" y2="115" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Stage 1: Detection -->
  <rect x="150" y="118" width="500" height="112" rx="6" fill="#eaf1fb" stroke="#2b5ea8" stroke-width="1.5"/>
  <text x="400" y="145" text-anchor="middle" font-size="15" font-weight="bold" fill="#173a63">[1] Detection — detection.py</text>
  <text x="400" y="167" text-anchor="middle" font-size="13" fill="#33465c">YOLOv8 locates the card and takes the highest-confidence box</text>
  <text x="400" y="185" text-anchor="middle" font-size="12" font-style="italic" fill="#4a6386">if no box is found, falls back to contour-based</text>
  <text x="400" y="201" text-anchor="middle" font-size="12" font-style="italic" fill="#4a6386">perspective warp (clean.py — detectwarp_image)</text>
  <text x="400" y="219" text-anchor="middle" font-size="12" fill="#33465c">crops the card region from the input image</text>

  <line x1="400" y1="230" x2="400" y2="270" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Stage 2: Clean/Deskew -->
  <rect x="150" y="273" width="500" height="90" rx="6" fill="#eafbf1" stroke="#2b8a5e" stroke-width="1.5"/>
  <text x="400" y="300" text-anchor="middle" font-size="15" font-weight="bold" fill="#164d33">[2] Clean / Deskew — clean.py</text>
  <text x="400" y="322" text-anchor="middle" font-size="13" fill="#2f5040">deskew and threshold the cropped card</text>
  <text x="400" y="340" text-anchor="middle" font-size="12" fill="#2f5040">uses skew detection, correction, and adaptive thresholding</text>
  <text x="400" y="356" text-anchor="middle" font-size="12" fill="#2f5040">from DocScanner_Deskew.py</text>

  <line x1="400" y1="363" x2="400" y2="403" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Stage 3: OCR + confidence gating -->
  <rect x="150" y="406" width="500" height="112" rx="6" fill="#fbf3ea" stroke="#a86a2b" stroke-width="1.5"/>
  <text x="400" y="433" text-anchor="middle" font-size="15" font-weight="bold" fill="#63391a">[3] OCR — ocr.py</text>
  <text x="400" y="455" text-anchor="middle" font-size="13" fill="#5c4530">EasyOCR reads the cleaned crop</text>
  <text x="400" y="473" text-anchor="middle" font-size="13" fill="#5c4530">returns text boxes with per-box confidence scores</text>
  <text x="400" y="491" text-anchor="middle" font-size="12" font-style="italic" fill="#8a5a2a">confidence gating happens here — low-confidence boxes</text>
  <text x="400" y="507" text-anchor="middle" font-size="12" font-style="italic" fill="#8a5a2a">are dropped before parsing sees them</text>

  <line x1="400" y1="518" x2="400" y2="558" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Stage 4: Parsing -->
  <rect x="150" y="561" width="500" height="100" rx="6" fill="#f6eafb" stroke="#7a2ba8" stroke-width="1.5"/>
  <text x="400" y="588" text-anchor="middle" font-size="15" font-weight="bold" fill="#4a1763">[4] Parsing — parse.py</text>
  <text x="400" y="610" text-anchor="middle" font-size="13" fill="#4b3556">groups OCR boxes into rows, matches name/ID/date patterns</text>
  <text x="400" y="628" text-anchor="middle" font-size="13" fill="#4b3556">dates sorted chronologically into DOB, issue, expiry</text>
  <text x="400" y="646" text-anchor="middle" font-size="12" font-style="italic" fill="#6a3a80">validated against Pydantic model (OCR_Output) before returning</text>

  <line x1="400" y1="661" x2="400" y2="701" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Output -->
  <rect x="220" y="704" width="360" height="70" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.5"/>
  <text x="400" y="731" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Output</text>
  <text x="400" y="752" text-anchor="middle" font-size="13" fill="#333333">{ fields, confidence_scores, raw_text }</text>

  <!-- Trace logger side note -->
  <line x1="650" y1="174" x2="710" y2="174" stroke="#666666" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="710" y1="174" x2="710" y2="739" stroke="#666666" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="710" y1="318" x2="650" y2="318" stroke="#666666" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="710" y1="462" x2="650" y2="462" stroke="#666666" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="710" y1="611" x2="650" y2="611" stroke="#666666" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="710" y1="739" x2="580" y2="739" stroke="#666666" stroke-width="1" stroke-dasharray="4,3"/>

  <rect x="700" y="432" width="90" height="60" rx="4" fill="#ffffff" stroke="#666666" stroke-width="1"/>
  <text x="745" y="457" text-anchor="middle" font-size="12" font-weight="bold" fill="#333333">trace_logging.py</text>
  <text x="745" y="474" text-anchor="middle" font-size="11" fill="#555555">trace.jsonl</text>
  <text x="745" y="486" text-anchor="middle" font-size="11" fill="#555555">per stage</text>

  <!-- Footnote -->
  <text x="400" y="820" text-anchor="middle" font-size="12" fill="#777777">Each stage logs its status independently — a failure in detection or OCR is caught and traced,</text>
  <text x="400" y="838" text-anchor="middle" font-size="12" fill="#777777">not allowed to crash the pipeline.</text>
</svg>
